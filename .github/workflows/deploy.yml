name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build & push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t ghcr.io/drex007/liqhawk:latest .
          docker push ghcr.io/drex007/liqhawk:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # docker-compose.yml + .env must already live in the SSH login dir (~).
          # Uses sudo: VPS_USER needs passwordless sudo for docker, and login
          # must be sudo too so the creds land in root's ~/.docker/config.json
          # (where `sudo docker compose pull` looks for them).
          script: |
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            sudo docker compose pull
            sudo docker compose up -d
